<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Amadeya — Администрирование</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        .admin-page {
            min-height: 100vh;
            padding: 50px 30px;
            color: #eee;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 32px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .admin-subtitle {
            margin-top: 10px;
            color: #999;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .admin-button {
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.05);
            color: #fff;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        .admin-button:hover {
            background: rgba(255,255,255,.1);
        }

        .users-list {
            display: grid;
            gap: 20px;
        }

        .user-card {
            background: rgba(20,20,30,.75);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 25px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .user-email {
            font-size: 18px;
        }

        .user-id {
            color: #888;
            font-size: 13px;
        }

        .admin-badge {
            color: #e9c46a;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .arcana-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .arcana-badge {
            padding: 6px 10px;
            border-radius: 4px;
            background: rgba(80,150,255,.15);
            border: 1px solid rgba(80,150,255,.3);
            color: #9bc8ff;
            font-size: 13px;
        }

        .access-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .arcana-select {
            background: #15151d;
            color: #fff;
            border: 1px solid rgba(255,255,255,.2);
            padding: 10px;
            border-radius: 5px;
        }

        .access-result {
            margin-top: 20px;
            padding: 15px;
            display: none;
            background: rgba(40,120,70,.15);
            border: 1px solid rgba(80,200,120,.3);
            border-radius: 6px;
        }

        .access-result.show {
            display: block;
        }

        .generated-password {
            color: #ffd166;
            font-family: monospace;
            font-size: 16px;
            margin: 8px 0;
            word-break: break-all;
        }

        .error {
            color: #ff7777;
        }

        .inactive {
            opacity: .5;
        }

        @media (max-width: 700px) {

            .admin-page {
                padding: 30px 15px;
            }

            .user-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .access-controls {
                flex-direction: column;
            }

            .arcana-select,
            .admin-button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="admin-page">

    <div class="admin-container">

        <div class="admin-header">

            <div class="admin-title">
                Администрирование
            </div>

            <div class="admin-subtitle">
                Управление пользователями и доступом к Арканам
            </div>

        </div>


        <div class="admin-actions">

            <button
                class="admin-button"
                id="refreshUsers"
            >
                ↻ Обновить
            </button>

            <button
                class="admin-button"
                id="logoutButton"
            >
                Выйти
            </button>

        </div>


        <div
            id="globalError"
            class="error"
        ></div>


        <div
            class="users-list"
            id="usersList"
        >
            Загрузка...
        </div>

    </div>

</div>


<script src="/static/js/admin.js"></script>

</body>

</html>
